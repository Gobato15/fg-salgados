<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — FG Salgados</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #FFF7ED;
            color: #1F2937;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }

        .logo {
            width: 84px;
            height: 84px;
            border-radius: 24px;
            background: #F59E0B;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 30px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #6B7280;
            margin-bottom: 24px;
            max-width: 320px;
        }

        a {
            background: #F59E0B;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 99px;
        }
    </style>
</head>

<body>
    <div class="logo">FG</div>
    <h1>Você está offline</h1>
    <p>Sem conexão no momento. Verifique sua internet para ver o cardápio e fazer pedidos.</p>
    <a href="./">Tentar novamente</a>
</body>

</html>
