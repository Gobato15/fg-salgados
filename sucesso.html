<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Seu pedido na FG Salgados foi enviado pelo WhatsApp. Aguarde a confirmação da nossa equipe!">
    <title>Pedido Enviado - FG Salgados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #FAF6F0;
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-image:
                radial-gradient(circle at 10% 10%, rgba(217, 119, 6, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 70%, rgba(225, 29, 72, 0.04) 0%, transparent 45%);
        }
        .success-card {
            background: white;
            border-radius: 28px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(39, 30, 23, 0.14);
            max-width: 480px;
            width: 90%;
            border: 1px solid #E5D8CA;
        }
        .success-icon {
            font-size: 80px;
            color: #25D366;
            margin-bottom: 25px;
            animation: bounceIn 0.8s ease;
        }
        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .brand-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #E11D48, #9F1239);
            color: #fff;
            font-weight: 900;
            font-size: 14px;
            padding: 6px 16px;
            border-radius: 99px;
            margin-bottom: 18px;
            box-shadow: 0 6px 16px rgba(225, 29, 72, 0.3);
        }
        .btn-whats {
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.35);
        }
        .btn-whats:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(37, 211, 102, 0.45);
            background: linear-gradient(135deg, #22BF5B, #0E7569);
        }
        .btn-amber {
            background: linear-gradient(135deg, #D97706, #B45309);
            color: white;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 6px 18px rgba(217, 119, 6, 0.3);
        }
        .btn-amber:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(217, 119, 6, 0.4);
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="brand-chip"><i class="fa-solid fa-snowflake"></i> FG Salgados</div>
        <i class="fa-brands fa-whatsapp success-icon"></i>
        <h2 class="fw-bold mb-3 text-dark">Pedido Enviado!</h2>
        <p class="text-muted mb-4">
            Abrimos o WhatsApp com o resumo do seu pedido.
            É só enviar a mensagem e aguardar a confirmação da nossa equipe para a entrega ou retirada.
        </p>
        <a href="index.html" class="btn btn-amber rounded-pill px-4 py-3 fw-bold w-100 fs-6 mb-3">
            <i class="fa-solid fa-store"></i> Voltar ao Cardápio
        </a>
        <a href="#" id="whatsAgain" target="_blank" rel="noopener" class="btn btn-whats rounded-pill px-4 py-3 fw-bold w-100 fs-6">
            <i class="fa-brands fa-whatsapp"></i> Falar no WhatsApp
        </a>
    </div>

    <script>
        var SITE_KEY = 'fg_salgados_v9';
        var DEFAULT_WHATS = '(19) 99609-0540';
        function getWhatsNumber() {
            try {
                var saved = JSON.parse(localStorage.getItem(SITE_KEY) || '{}');
                var whats = (saved.contact && saved.contact.whats) || DEFAULT_WHATS;
                return String(whats).replace(/\D/g, '');
            } catch (e) {
                return DEFAULT_WHATS.replace(/\D/g, '');
            }
        }
        document.getElementById('whatsAgain').href = 'https://wa.me/' + getWhatsNumber() + '?text=' + encodeURIComponent('Olá! Vim pelo site da FG Salgados 🙂');
    </script>
</body>
</html>
